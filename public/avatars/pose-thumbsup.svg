<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <filter id="sticker-shadow-thumb" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Transparent Background Graphic -->
  <g filter="url(#sticker-shadow-thumb)">
    <!-- Comic Action Burst behind -->
    <circle cx="200" cy="220" r="140" fill="#FFF8F0" />
    <path d="M 80 180 L 50 160 M 320 180 L 350 160 M 200 60 L 200 30 M 100 100 L 70 80 M 300 100 L 330 80" stroke="#FF5500" stroke-width="4" stroke-linecap="round" />

    <!-- Character Body / Shoulders (White Pinstripe Shirt) -->
    <path d="M 120 480 C 120 370, 150 350, 200 350 C 250 350, 280 370, 280 480 Z" fill="#FFFFFF" stroke="#121215" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Pinstripes -->
    <path d="M 160 380 L 155 480 M 180 365 L 178 480 M 220 365 L 222 480 M 240 380 L 245 480" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Open Collar -->
    <path d="M 175 350 L 200 395 L 225 350" fill="#E5E7EB" stroke="#121215" stroke-width="5"/>
    <path d="M 165 348 L 180 385 L 200 350" fill="#FFFFFF" stroke="#121215" stroke-width="5"/>
    <path d="M 235 348 L 220 385 L 200 350" fill="#FFFFFF" stroke="#121215" stroke-width="5"/>

    <!-- Neck -->
    <path d="M 180 310 L 180 360 C 190 370, 210 370, 220 360 L 220 310 Z" fill="#D49B74" stroke="#121215" stroke-width="5"/>

    <!-- Head / Face -->
    <path d="M 150 210 C 150 285, 170 325, 200 325 C 230 325, 250 285, 250 210 C 250 160, 230 160, 200 160 C 170 160, 150 160, 150 210 Z" fill="#E2AA84" stroke="#121215" stroke-width="6" stroke-linejoin="round"/>

    <!-- Ears -->
    <ellipse cx="148" cy="225" rx="10" ry="16" fill="#D49B74" stroke="#121215" stroke-width="5"/>
    <ellipse cx="252" cy="225" rx="10" ry="16" fill="#D49B74" stroke="#121215" stroke-width="5"/>

    <!-- Stylish Hair -->
    <path d="M 140 200 C 130 150, 160 110, 190 105 C 230 100, 260 120, 265 160 C 275 180, 260 210, 250 210 C 245 185, 235 170, 200 170 C 165 170, 155 185, 145 205 Z" fill="#18181D" stroke="#121215" stroke-width="6"/>
    <path d="M 160 135 C 180 115, 215 115, 240 130" stroke="#33333C" stroke-width="5" stroke-linecap="round"/>
    <path d="M 175 155 C 195 135, 225 140, 250 150" stroke="#33333C" stroke-width="5" stroke-linecap="round"/>

    <!-- Playful confident wink/smile -->
    <path d="M 165 200 Q 180 193 192 198" stroke="#121215" stroke-width="5" stroke-linecap="round"/>
    <path d="M 208 195 Q 220 190 235 196" stroke="#121215" stroke-width="5" stroke-linecap="round"/>

    <!-- Left eye open -->
    <ellipse cx="178" cy="215" rx="7" ry="9" fill="#121215"/>
    <circle cx="176" cy="212" r="2.5" fill="#FFFFFF"/>
    <!-- Right eye confident wink -->
    <path d="M 214 216 Q 224 210 232 216" fill="none" stroke="#121215" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 200 215 L 197 240 L 204 240" fill="none" stroke="#B87B57" stroke-width="4" stroke-linecap="round"/>

    <!-- Big grin -->
    <path d="M 183 262 Q 200 284 218 262" fill="none" stroke="#121215" stroke-width="5" stroke-linecap="round"/>

    <!-- HAND: THUMBS UP 👍 (Foreground right) -->
    <path d="M 265 430 Q 290 360 295 310" stroke="#E2AA84" stroke-width="32" stroke-linecap="round"/>
    <!-- Fist -->
    <rect x="270" y="270" width="48" height="42" rx="16" fill="#E2AA84" stroke="#121215" stroke-width="5"/>
    <!-- Fingers curled lines -->
    <path d="M 278 283 L 305 283 M 278 295 L 305 295 M 278 305 L 302 305" stroke="#121215" stroke-width="4" stroke-linecap="round"/>
    <!-- Big Thumb pointing UP -->
    <path d="M 292 274 L 292 205 C 292 192, 314 192, 314 205 L 314 274 Z" fill="#E2AA84" stroke="#121215" stroke-width="5" stroke-linejoin="round"/>
    <!-- Thumb knuckle crease -->
    <path d="M 296 235 L 310 235" stroke="#D49B74" stroke-width="3" stroke-linecap="round"/>

    <!-- Thumbs up motion speed lines -->
    <path d="M 330 200 L 350 195 M 335 220 L 355 220 M 330 240 L 348 245" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/>

    <!-- Sparkle Stars -->
    <g transform="translate(325, 140) scale(0.9)">
      <path d="M 20 0 L 24 14 L 38 20 L 24 26 L 20 40 L 16 26 L 2 20 L 16 14 Z" fill="#FF5500"/>
    </g>

    <!-- Comic Badge Pill -->
    <rect x="235" y="85" width="130" height="34" rx="17" fill="#FF5500"/>
    <text x="300" y="108" fill="#FFFFFF" font-family="'Syne', sans-serif" font-weight="800" font-size="14" text-anchor="middle">LET'S BUILD 👍</text>
  </g>
</svg>
